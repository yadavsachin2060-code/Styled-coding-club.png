
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #eef2ff;
            font-family: Georgia, serif;
            color: #202a44;
        }

        /* Header */
        header {
            background-color: #3159e8;
            color: white;
            text-align: center;
            padding: 48px 20px;
            border-radius: 13px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 42px;
            margin: 0 0 12px;
        }

        header p {
            font-size: 20px;
            margin: 0;
        }

        /* Sections */
        section {
            background-color: white;
            padding: 20px;
            border-radius: 13px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 30px;
            margin: 5px 0 15px;
        }

        /* Events Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #3159e8;
            color: white;
            text-align: left;
            padding: 14px 10px;
            font-size: 20px;
        }

        td {
            padding: 14px 10px;
            border-bottom: 1px solid #ccc;
            font-size: 18px;
        }

        /* Registration Form */
        label {
            font-size: 18px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            background-color: #3159e8;
            color: white;
            border: none;
            padding: 13px 23px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d40bb;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            header h1 {
                font-size: 34px;
            }

            td, th {
                font-size: 16px;
                padding: 12px 7px;
            }

            input {
                max-width: 65%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Coding Club</h1>
        <p>Learn. Build. Share.</p>
    </header>

    <!-- Upcoming Events -->
    <section>
        <h2>Upcoming Events</h2>

        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>HTML Workshop</td>
                    <td>12 Nov</td>
                    <td>Lab 1</td>
                </tr>

                <tr>
                    <td>Hackathon</td>
                    <td>20 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- Registration Form -->
    <section>
        <h2>Register</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name"
                   placeholder="Your name" required>
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email"
                   placeholder="you@example.com" required>
            <br>

            <button type="submit">Register</button>
        </form>
    </section>

</body>
</html>
